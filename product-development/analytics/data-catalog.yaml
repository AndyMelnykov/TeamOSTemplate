# example_product Data Catalog
# Registry of warehouse tables. For column-level detail, see schemas/ docs.
#
# Naming note: several tables carry a legacy name (matching this catalog's
# keys and the schema doc filenames under schemas/) that differs from the
# name used in current dashboards, investigations, and experiment writeups.
# Both names refer to the same underlying table:
#   projects            -> workflows
#   project_generations -> workflow_automation_runs
#   project_versions    -> workflow_versions
#   deployments (deploy_events) -> publish_events

tables:
  # --- Core entities ---
  users:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: User accounts - signups, profiles, auth metadata
    owner: data-engineering
    refresh: daily
    upstream: Auth service → Fivetran
    used_by: [retention, activation, funnel analysis]

  organizations:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Organization accounts - team structure, plan tier, billing info
    owner: data-engineering
    refresh: daily
    upstream: Billing service → Fivetran
    used_by: [revenue reporting, account health, seat analysis]

  projects:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Customer workflows - metadata, creation date, feature area, last activity. Referenced as `workflows` in current docs.
    owner: data-engineering
    refresh: daily
    upstream: example_product API → Fivetran
    used_by: [WCR, engagement, feature adoption]

  # --- Automation runs ---
  project_generations:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Every AI automation run (document extraction attempt) - instruction, status, timing, model version, output document type. Referenced as `workflow_automation_runs` in current docs.
    owner: data-engineering
    refresh: streaming (Snowpipe)
    upstream: Automation run service → Snowpipe
    used_by: [ESR, extraction quality, error taxonomy, model performance]
    schema_doc: schemas/prototyping/project-generations.md

  # --- Publishing ---
  deployments:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Publish events - workflow, environment, portal URL, status, duration. Table is queried as `publish_events` (legacy name `deploy_events`); referenced as `publish_events` in current docs.
    owner: data-engineering
    refresh: streaming (Snowpipe)
    upstream: Publish service → Snowpipe
    used_by: [TTP, publish frequency, WCR]

  domain_certificates:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Custom portal domain SSL certificates - domain, status, expiry, renewal events
    owner: data-engineering
    refresh: daily
    upstream: Certificate manager → Fivetran
    used_by: [custom domain adoption, SSL health monitoring]
    schema_doc: schemas/deployment/domain_certificates.md

  # --- Billing ---
  subscriptions:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Subscription records - plan tier, MRR, start/end dates, trial status
    owner: data-engineering
    refresh: daily
    upstream: Stripe → Fivetran
    used_by: [revenue, churn, conversion, plan distribution]

  credit_transactions:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Credit ledger - purchases, usage (pages/documents processed), refunds, referral credits, balance changes
    owner: data-engineering
    refresh: daily
    upstream: Billing service → Fivetran
    used_by: [credit usage dashboards, referral tracking, revenue recognition]
    schema_doc: schemas/billing/credit_transactions.md

  # --- Home Page ---
  search_events:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Global search (Cmd+K) interactions across workflows, templates, and automation runs - queries, results, clicks, filters
    owner: data-engineering
    refresh: streaming (Snowpipe)
    upstream: Search service → Snowpipe
    used_by: [search quality, home page engagement]
    schema_doc: schemas/home-page/search_events.md

  # --- Prototyping (workflow building) ---
  project_versions:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Workflow/template version history snapshots - workflow state at each save point. Referenced as `workflow_versions` in current docs.
    owner: data-engineering
    refresh: daily
    upstream: Version service → Fivetran
    used_by: [version history adoption, refinement depth]
    schema_doc: schemas/prototyping/project_versions.md

  # --- Starter Templates (document template marketplace) ---
  published_templates:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Document templates published to the marketplace - metadata, author, category, ratings
    owner: data-engineering
    refresh: daily
    upstream: Template service → Fivetran
    used_by: [marketplace analytics, template quality]
    schema_doc: schemas/starter-templates/published_templates.md

  template_forks:
    database: ANALYTICS
    schema: EXAMPLE_PRODUCT
    description: Template fork events - which templates are used, by whom, conversion to workflows
    owner: data-engineering
    refresh: daily
    upstream: Template service → Fivetran
    used_by: [template adoption, marketplace conversion, starter template impact]
    schema_doc: schemas/starter-templates/template_forks.md
